# Prometheus needs to discover pods across aura-secure AND aura-vulnerable
# (both separate namespaces from aura-monitoring), so this is a ClusterRole,
# not a namespaced Role — read-only (get/list/watch), no write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aura-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aura-monitoring
