{{- if .Values.vulnerable.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-vulnerable-credentials
  namespace: {{ .Values.vulnerable.namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.vulnerable.mysql.rootPassword | quote }}
  MYSQL_USER: {{ .Values.vulnerable.mysql.user | quote }}
  MYSQL_PASSWORD: {{ .Values.vulnerable.mysql.password | quote }}
  MYSQL_DATABASE: {{ .Values.vulnerable.mysql.database | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-vulnerable-data
  namespace: {{ .Values.vulnerable.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.vulnerable.mysql.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-vulnerable
  namespace: {{ .Values.vulnerable.namespace }}
  labels: { app: mysql-vulnerable }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mysql-vulnerable }
  template:
    metadata:
      labels: { app: mysql-vulnerable }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports: [{ containerPort: 3306 }]
          envFrom:
            - secretRef: { name: mysql-vulnerable-credentials }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init-scripts, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          resources:
            {{- toYaml .Values.vulnerable.mysql.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            periodSeconds: 5
            failureThreshold: 60 # up to 5 minutes for first-time init before liveness/readiness kick in
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mysql-vulnerable-data }
        - name: init-scripts
          configMap: { name: mysql-vulnerable-init } # generated out-of-band, see k8s/README.md
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-vulnerable
  namespace: {{ .Values.vulnerable.namespace }}
spec:
  selector: { app: mysql-vulnerable }
  ports: [{ port: 3306, targetPort: 3306 }]
{{- end }}
