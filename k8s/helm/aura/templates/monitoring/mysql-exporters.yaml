{{- if .Values.monitoring.enabled }}
{{- if .Values.secure.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-exporter-secure-cnf
  namespace: {{ .Values.monitoring.namespace }}
type: Opaque
stringData:
  .my.cnf: |
    [client]
    user=root
    password={{ .Values.secure.mysql.rootPassword }}
    host=mysql-secure.{{ .Values.secure.namespace }}.svc.cluster.local
    port=3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter-secure
  namespace: {{ .Values.monitoring.namespace }}
  labels: { app: mysql-exporter-secure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql-exporter-secure }
  template:
    metadata:
      labels: { app: mysql-exporter-secure }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9104" }
    spec:
      containers:
        - name: mysqld-exporter
          image: {{ .Values.monitoring.mysqlExporter.image }}
          args:
            - --config.my-cnf=/etc/mysql-exporter/.my.cnf
          ports: [{ containerPort: 9104 }]
          volumeMounts:
            - name: mysql-cnf
              mountPath: /etc/mysql-exporter
              readOnly: true
          resources:
            {{- toYaml .Values.monitoring.mysqlExporter.resources | nindent 12 }}
      volumes:
        - name: mysql-cnf
          secret:
            secretName: mysql-exporter-secure-cnf
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter-secure
  namespace: {{ .Values.monitoring.namespace }}
spec:
  selector: { app: mysql-exporter-secure }
  ports: [{ port: 9104, targetPort: 9104 }]
{{- end }}
{{- if .Values.vulnerable.enabled }}
