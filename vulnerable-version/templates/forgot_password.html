{% extends "base.html" %}

{% block title %}Forgot Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div style="width:100%;max-width:420px;">
        <div class="glass-card no-hover">
            <div style="padding:40px;">
                <h2 class="page-title text-center mb-2" style="font-size:1.5rem;">Forgot Password</h2>
                <p class="text-center mb-4" style="color:var(--ts);font-size:0.875rem;">Enter your account's email and we'll send you a reset link.</p>

                <!-- VULNERABILITY: No CSRF protection -->
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    <div class="form-group-glass">
                        <label for="email" class="form-label-glass">Email</label>
                        <input type="email" class="glass-input" id="email" name="email"
                               placeholder="you@example.com">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Send Reset Link</button>
                    </div>
                </form>

                <div class="glass-divider my-4"></div>

                <p class="text-center mb-0" style="font-size:0.875rem;">
                    <a href="{{ url_for('auth.login') }}">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
