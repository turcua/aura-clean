{% extends "base.html" %}

{% block title %}Login - {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div style="width:100%;max-width:420px;">
        <div class="glass-card no-hover">
            <div style="padding:40px;">
                <h2 class="page-title text-center mb-2" style="font-size:1.5rem;">Welcome Back</h2>
                <p class="text-center mb-4" style="color:var(--ts);font-size:0.875rem;">Sign in to your account</p>

                <!-- VULNERABILITY: No CSRF protection -->
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="form-group-glass">
                        <label for="username" class="form-label-glass">Username</label>
                        <!-- VULNERABILITY: No input validation -->
                        <input type="text" class="glass-input" id="username" name="username"
                               placeholder="Enter username">
                    </div>
                    <div class="form-group-glass">
                        <label for="password" class="form-label-glass">Password</label>
                        <input type="password" class="glass-input" id="password" name="password"
                               placeholder="Enter password">
                    </div>
                    <p class="mb-0" style="text-align:right;">
                        <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--ts);font-size:0.85rem;">Forgot password?</a>
                    </p>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Sign In</button>
                    </div>
                </form>

                <div class="glass-divider my-4"></div>

                <p class="text-center mb-3" style="font-size:0.875rem;">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
                </p>

                <!-- VULNERABILITY: Information disclosure -->
                <div class="alert alert-warning" role="alert">
                    <small>Hint: Try SQL injection! Example: <code>admin' OR '1'='1</code></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
