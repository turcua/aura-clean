{% extends "base.html" %}

{% block title %}Reset Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
    <div style="width:100%;max-width:420px;">
        <div class="glass-card no-hover">
            <div style="padding:40px;">
                <h2 class="page-title text-center mb-2" style="font-size:1.5rem;">Reset Password</h2>

                <!-- VULNERABILITY: No CSRF protection -->
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <div class="form-group-glass">
                        <label for="password" class="form-label-glass">New Password</label>
                        <input type="password" class="glass-input" id="password" name="password"
                               placeholder="Enter new password">
                    </div>
                    <div class="form-group-glass">
                        <label for="confirm_password" class="form-label-glass">Confirm New Password</label>
                        <input type="password" class="glass-input" id="confirm_password" name="confirm_password"
                               placeholder="Confirm new password">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
