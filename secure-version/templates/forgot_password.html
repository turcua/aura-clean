{% extends "base.html" %}

{% block title %}Forgot Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="glass-card no-hover p-4 p-md-5">
            <h2 class="page-title text-center mb-4" style="font-size:1.4rem;">Forgot Password</h2>
            <p class="text-center mb-4" style="color:var(--ts);">Enter your account's email and we'll send you a link to reset your password.</p>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group-glass">
                    <label for="email" class="form-label-glass">Email</label>
                    <input type="email" class="glass-input" id="email" name="email"
                           required placeholder="you@example.com">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Send Reset Link</button>
                </div>
            </form>

            <div class="glass-divider my-4"></div>

            <p class="text-center mb-0" style="color:var(--ts);">
                <a href="{{ url_for('auth.login') }}">Back to Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
