{% extends "base.html" %}

{% block title %}Two-Factor Authentication - {{ app_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="glass-card no-hover p-4 p-md-5">
            <h2 class="page-title text-center mb-4" style="font-size:1.4rem;">Two-Factor Authentication</h2>
            <p class="text-center mb-4" style="color:var(--ts);">Enter the 6-digit code from your authenticator app.</p>

            <form method="POST" action="{{ url_for('auth.verify_2fa') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group-glass">
                    <label for="code" class="form-label-glass">Authentication Code</label>
                    <input type="text" class="glass-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456" autofocus>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Verify</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
