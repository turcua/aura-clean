{% extends "base.html" %}

{% block title %}Login - {{ app_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="glass-card no-hover p-4 p-md-5">
            <h2 class="page-title text-center mb-4" style="font-size:1.4rem;">Login</h2>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group-glass">
                    <label for="username" class="form-label-glass">Username</label>
                    <input type="text" class="glass-input" id="username" name="username"
                           required placeholder="Enter username">
                </div>

                <div class="form-group-glass">
                    <label for="password" class="form-label-glass">Password</label>
                    <input type="password" class="glass-input" id="password" name="password"
                           required placeholder="Enter password">
                </div>

                <p class="mb-3" style="text-align:right;">
                    <a href="{{ url_for('auth.forgot_password') }}" style="color:var(--ts);font-size:0.85rem;">Forgot password?</a>
                </p>

                <div class="d-grid">
                    <button type="submit" class="btn-glass btn-glass-secondary btn-lg">Login</button>
                </div>
            </form>

            <div class="glass-divider my-4"></div>

            <p class="text-center mb-0" style="color:var(--ts);">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
